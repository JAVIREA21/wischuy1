<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Wischuy · Cusco, Perú</title>
<style>
:root{font-family:Roboto,system-ui,sans-serif;color:#14241d;background:#e9f0eb;--green:#0d5c43;--ink:#14241d;--muted:#4b5f55;--soft:#e5f3ec;--line:#c4d3c9;--blue:#175d9c}
*{box-sizing:border-box}
body{margin:0}
button,input,select{font:inherit}
button{cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.shell{max-width:460px;min-height:100dvh;margin:auto;background:#fff}
header{display:flex;align-items:center;gap:12px;padding:20px 22px;border-bottom:1px solid #e4ece6}
.brand-icon,.symbol,.marker{display:grid;place-items:center;border-radius:14px;flex:none}
.brand-icon{width:44px;height:44px;background:var(--soft);color:var(--green)}
svg.icon{width:24px;height:24px;display:block}
.brand strong,.brand span{display:block}.brand strong{font-size:15px}.brand span{font-size:13px;color:var(--muted)}
main{padding:24px 22px 32px}
h1{font-size:29px;line-height:1.13;margin:0 0 8px;letter-spacing:-.6px}
h2{font-size:21px;line-height:1.2;margin:0 0 6px}
p{margin:0 0 16px;color:var(--muted);line-height:1.5}
.stack{display:grid;gap:12px}.stack>*{min-width:0}
.hero{margin-bottom:22px}
.role{display:grid;grid-template-columns:48px minmax(0,1fr) 24px;align-items:center;gap:12px;text-align:left;min-height:100px;padding:14px;border:0;border-radius:18px;background:var(--soft);color:var(--ink)}
.role.primary{background:var(--green);color:white}
.role .symbol{width:48px;height:48px;background:#fff;color:var(--green)}
.role.primary .symbol{background:#26765d;color:white}
.role strong,.role small{display:block}.role strong{font-size:20px}.role small{margin-top:4px;font-size:14px;line-height:1.35}
.hint{font-size:13px;color:var(--muted);margin:12px 0 0}
.btn{min-height:50px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:10px 12px;font-weight:700;color:var(--green)}
.btn.primary{min-height:56px;background:var(--green);color:#fff;border-color:var(--green)}
.btn.link{border-color:transparent;background:transparent}
.btn.danger{background:#a52b20;color:#fff;border-color:#a52b20}
.btn:disabled{cursor:default;background:#eef2ef;color:#53645a;border-color:transparent}
.actions{display:grid;gap:8px;margin-top:12px}
.inline{display:flex;gap:8px;flex-wrap:wrap}.inline>*{flex:1 1 auto}.compact{margin-top:10px}
.card{background:#f1f6f2;border:1px solid #e4ece6;border-radius:15px;padding:14px}
.card.accent{background:var(--soft);border-color:transparent}
.card p{margin:4px 0 0}
small{line-height:1.4}
label{display:grid;gap:5px;font-weight:650;font-size:14px}
input:not([type=checkbox]),select{min-height:50px;width:100%;border:1px solid #819488;border-radius:11px;background:#fff;padding:9px 12px;color:var(--ink)}
input[type=file]{font-size:13px}
.check{display:flex;align-items:center;gap:12px;min-height:50px}
.check input{width:22px;height:22px;accent-color:var(--green)}
.map{position:relative;aspect-ratio:340/260;margin:12px 0 0;border-radius:16px;overflow:hidden;background:#e9eee8}
.map>svg{display:block;width:100%;height:100%}
.map-label{font-size:13px;margin:6px 0 12px;color:var(--muted)}
.dot{position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-50%);width:16px;height:16px;background:var(--blue);border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 4px #c4dff4}
.marker{position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-50%);width:33px;height:33px;background:var(--green);color:white;border:2px solid white;border-radius:8px}
.marker .icon{width:20px;height:20px}
.tag{display:inline-block;padding:3px 8px;background:#fff;border-radius:6px;font-size:13px;color:var(--green);font-weight:750}
ol{padding:0;list-style:none;margin:0;display:grid;gap:8px}
li span, .card span{display:block}
.progress{color:var(--muted);font-size:13px;margin:4px 0}
dialog{width:min(100% - 24px,446px);max-height:85dvh;padding:20px;border:0;border-radius:18px;color:var(--ink);box-shadow:0 12px 50px #14241d66}
dialog::backdrop{background:#14241d77}
dialog .btn{width:100%}
.thumb{display:block;width:82px;height:82px;border:1px solid var(--line);border-radius:10px;object-fit:cover}
.source{color:var(--green);font-weight:700}
.on-map{position:relative}
.welcome-flyer{margin:0;overflow:hidden;border-radius:24px;background:#153d31;color:#fff;box-shadow:0 12px 28px #123c301f}
.flyer-copy{padding:21px 21px 18px;background:linear-gradient(120deg,#153d31,#17634a)}
.flyer-copy .place{font-size:12px;font-weight:750;letter-spacing:.13em;text-transform:uppercase;color:#fae6a5;margin:0 0 8px}
.flyer-copy h1{font-size:clamp(46px,12vw,66px);letter-spacing:-.065em;line-height:.98;margin:0 0 9px}
.flyer-copy p{color:#e4f1e9;font-size:14px;line-height:1.35;margin:0}
.welcome-flyer img{display:block;width:100%;height:clamp(220px,37svh,340px);object-fit:cover;object-position:center 58%}
.welcome-actions{margin-top:17px}
.welcome-actions>.btn{width:100%;min-height:56px}
header[hidden]{display:none}
.flyer-copy .place{text-transform:none}
.flyer-copy .mascot{width:54px;height:54px;float:right;margin:4px 0 4px 9px}
.flyer-copy #welcome-title{font-size:clamp(53px,14vw,74px)}
.flyer-copy #welcome-title span{display:block;font-size:18px;font-weight:650;letter-spacing:0;line-height:1.15;margin-bottom:6px}
.welcome-flyer img{height:clamp(240px,49svh,416px);object-position:center 59%}
.flyer-copy .slogan{font-size:16px;font-weight:650;color:#f8e7ae}
.hero-character{display:flex;align-items:flex-start;gap:12px;justify-content:space-between}
.hero-character .hero-text{min-width:0}
.hero-character .mascot{width:57px;height:57px;flex:none}
.district-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.district-option{display:flex;align-items:center;gap:8px;text-align:left;min-height:52px;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:#f6faf4;font-weight:700}
.district-option::before{content:"";display:block;width:9px;height:9px;flex:none;border-radius:100%;background:var(--district-tint)}
.district-option[aria-current="true"]{border:2px solid #0d5c43;background:#e5f3ec}
.district-summary{display:flex;align-items:center;justify-content:space-between;gap:8px}
.district-summary .progress{margin:0}
.eco-tip{display:flex;gap:11px;align-items:center;margin:24px 0 0;padding:14px;border:1px solid #d1e2d2;border-radius:15px;background:#f2f7ef;color:#1a3b2c}
.eco-tip svg{width:44px;height:44px;flex:none}
.eco-tip strong{display:block;font-size:15px;margin-bottom:4px}
.eco-tip p{font-size:13px;margin:0}
.map-source{font-size:12px;margin-top:-7px}.map-source a{color:#0D5C43;text-underline-offset:2px}
.stop-legend{font-size:13px;color:#405c50}

@media(max-height:610px){.welcome-flyer img{height:230px}}


</style></head><body>

 }).join('');
 return sanJeronimoSvg.replace('</svg>',numbered+'</svg>');
}

function selectDistrict(index) {
 const entry = districts[index];
 if(!entry) return;
 if(role==='driver'){
  driverDistrict=entry.name;

  driver=driverRuns.get(entry.name);

 }else{
  if(neighbor.district!==entry.name){

   neighbor.zone=entry.zones[0];

 }
}

function drive() {
 const district=selectedDistrict(false);
 const stops=district.stops;
 const assigned=!!(driver.truck&&driver.route);
 const labels={ready:'Iniciar recorrido',active:'Pausar recorrido',paused:'Reanudar recorrido'};
 const status={ready:'Listo para iniciar',active:'En recorrido',paused:'En pausa',finished:'Recorrido finalizado'};
 const next=stops.find((_,i)=>!driver.done.includes(i));
 const summary=driver.phase==='finished'?'Resumen del recorrido':'Próxima parada';
 const upcoming=driver.phase==='finished'?(stops.length-driver.done.length)+' pendientes':next||'Todas las paradas completadas';
 const routeControl = driver.phase==='finished' ? '' : assigned ? btn(labels[driver.phase],'phase','primary') : '<button type="button" class="btn primary" disabled>Iniciar recorrido</button>';
 const controls = assigned&&!driver.editing?
 '<div class="card"><strong>Camión 03 · '+esc(routeCaption(district))+'</strong>'+(!driver.started?btn('Cambiar asignación','edit-assignment','link'):'')+'</div>':
 '<div class="stack card"><label>Camión<select id="truck">'+opt('','Seleccionar camión',driver.truck)+opt('03','Camión 03 · REC-03',driver.truck)+'</select></label>'+
 '<label>Ruta<select id="route" '+(!driver.truck?'disabled':'')+'>'+opt('','Seleccionar ruta',driver.route)+opt(district.route,routeCaption(district),driver.route)+'</select></label></div>';
 return heading('Recorrido',assigned?'':'Selecciona el camión y la ruta del turno.',driver.phase==='finished'?'cheer':driver.phase==='paused'?'alert':'focus')+
 '<div class="district-summary"><strong>'+esc(district.name)+'</strong>'+btn('Cambiar distrito','district-drive','link')+'</div>'+controls+
 map(false)+'<div class="card accent"><span class="tag">'+status[driver.phase]+'</span><div class="progress">'+summary+'</div><strong>'+esc(upcoming)+'</strong><div class="progress">'+driver.done.length+' de '+stops.length+' completadas</div></div>'+
 actions(routeControl,
 ['active','paused'].includes(driver.phase)?btn('Finalizar recorrido','finish'):'',
 row(btn('Ver paradas','stops'),btn('Reportar incidencia','report')),
 row(btn('Avisos','notices','link'),btn('Mi perfil','driver-profile','link')));
}

  if(photoURL){URL.revokeObjectURL(photoURL);photoURL='';}
  showPanel(role==='driver'?'Reportar incidencia':'Reportar problema','<p>Los datos del formulario quedan en esta demostración.</p>'+
   '<form class="stack" id="report-form"><label>Tipo de problema<select name="type" required>'+opt('','Selecciona una opción')+types[role].map(s=>opt(s)).join('')+'</select></label>'+
   '<label>Ubicación<input name="place" required value="'+esc((role==='driver'?selectedDistrict(false).refs[0]:neighbor.street)+', '+selectedDistrict().name)+'"></label>'+
   '<label>Foto (opcional)<input type="file" id="photo" accept="image/*"></label><img id="thumb" class="thumb" alt="Foto adjunta" hidden>'+
   '<button class="btn primary">Enviar reporte</button></form>'+actions(btn('Cancelar','close','link')), target=>{
    if(target.id==='photo'){
      if(photoURL) URL.revokeObjectURL(photoURL);
      const item=target.files[0];
      photoURL=item?URL.createObjectURL(item):'';
      const thumb=$('thumb');
      if(photoURL) thumb.src=photoURL;
      thumb.hidden=!photoURL;
    }
   });
 },
 'history': () => showPanel('Mis reportes',reports.filter(r=>r.role==='neighbor').length?
  '<ol>'+reports.filter(r=>r.role==='neighbor').map(r=>'<li class="card"><strong>'+esc(r.type)+'</strong><span>'+esc(r.place)+'</span><span class="progress">'+(r.photo?'Enviado · Con foto':'Enviado')+'</span></li>').join('')+'</ol>'+actions(btn('Cerrar','close','link')):
  '<p>Tus reportes enviados aparecerán aquí.</p>'+ecoTip(['Tu reporte ayuda','Incluye una calle o referencia para ubicar el problema.'])+actions(btn('Cerrar','close','link'))),
 'settings': () => showPanel('Ajustes','<div class="stack"><label class="card check"><input id="notify" type="checkbox" '+(permissions.notify?'checked':'')+'>Avisos de cercanía</label>'+
  '<label>Radio de alerta<select id="radius">'+opt('300','300 m',neighbor.radius)+opt('500','500 m',neighbor.radius)+'</select></label>'+
  '<div class="card"><strong>Zona guardada</strong><p>'+esc(neighbor.district+' · '+neighbor.zone+' · '+neighbor.street)+'</p></div></div>'+
  actions(btn('Cambiar zona guardada','zone'),btn('Municipalidad y emergencias','contact'),btn('Volver al mapa','close','link'))),
 'contact': () => {
  const district=selectedDistrict(true);
  const details=district.name==='San Jerónimo'?'<div class="card"><strong>Central municipal</strong><p>Plaza de Armas s/n · (084) 278 216</p></div><div class="card"><strong>Serenazgo</strong><p>(084) 278 029</p></div><p class="hint"><a class="source" href="https://www.gob.pe/institucion/munisanjeronimo-cusco/contacto-y-numeros-de-emergencias" target="_blank" rel="noopener noreferrer">Ver canales oficiales</a></p>':'<p>Consulta los canales de atención de la Municipalidad Distrital de '+esc(district.name)+'.</p>';
  showPanel('Municipalidad y emergencias','<p>'+esc(district.name)+', Cusco</p>'+details+actions(btn('Volver a Ajustes','settings','link')));
 }

};
function activate(name) {
 if(name==='enter-driver') { role='driver';return show('login'); }
 if(name==='enter-neighbor') { role='neighbor';return show('welcome'); }
 if(name==='home') { role='';return show('home'); }
 if(name==='demo-login') return changeDistrict('login');
 if(name==='district-drive') return changeDistrict('drive');
 if(name==='district-map') return changeDistrict('neighbor-map');
 if(name==='district-zone') return changeDistrict('zone');
 if(name==='district-permission') return changeDistrict('permission');
 if(name==='district-back') return show(districtReturn || 'home');
 if(/^district-[0-7]$/.test(name)) return selectDistrict(Number(name.slice(-1)));
 if(name==='toggle-password'){
  const field=$('password');field.type=field.type==='password'?'text':'password';
  const control=root.querySelector('[data-action="toggle-password"]');
  control.textContent=field.type==='password'?'Mostrar contraseña':'Ocultar contraseña';
  return;
 }
 if(name==='close') return dismiss();
 if(name==='skip'){permissions.location=false;permissions.notify=false;return changeDistrict('permission');}
 if(name==='edit-assignment'){driver.editing=true;render();$('truck').focus();return;}
 if(name==='phase'){
  if(!driver.truck||!driver.route||driver.phase==='finished') return;
  driver.started=true;
  driver.phase=driver.phase==='active'?'paused':'active';
  return render();
 }
 if(name==='confirm-finish'){driver.phase='finished';dismiss();return render();}
 if(name.startsWith('stop-')){
  const i=Number(name.slice(5));
  if(['active','paused'].includes(driver.phase)&&selectedDistrict(false).stops[i]&&!driver.done.includes(i)) driver.done.push(i);
  render();
  return panelActions.stops();
 }
 if(panelActions[name]) return panelActions[name]();
 if(['permission','zone','neighbor-map'].includes(name)) return show(name);
}
document.addEventListener('click', event => {
 const button=event.target.closest('button[data-action]');
 if(button) activate(button.dataset.action);
});
document.addEventListener('change', event => {
 optionSave(event.target);
 if(dialog.open&&onChange) onChange(event.target);
});
document.addEventListener('submit', event => {
 event.preventDefault();
 if(event.target.id==='driver-login') return changeDistrict('login');
 if(event.target.id==='resident-registration') return show('permission');
 if(event.target.id==='report-form'){
  const form=new FormData(event.target);
  reports.unshift({role,type:form.get('type'),place:form.get('place'),photo:Boolean(photoURL)});
  if(photoURL){URL.revokeObjectURL(photoURL);photoURL='';}
  return showPanel('Reporte enviado','<p>Se agregó a esta demostración.</p>'+actions(btn(role==='neighbor'?'Ver mis reportes':'Volver al recorrido',role==='neighbor'?'history':'close','primary')));
 }
});
render();
</script></body></html>
